<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/jpeg" href="/fav.jpg" />
    <link rel="apple-touch-icon" href="/fav.jpg" />
    <title>Secure scan | Nsaa Tickets</title>
    <meta name="robots" content="noindex" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/nsaa.css" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body class="scanner-body">
    <div class="scanner-shell">
      <header class="scanner-topbar">
        <div class="scanner-brand">
          <img class="scanner-brand-mark" src="/logo.jpeg" alt="" />
          <div>
            <p class="scanner-brand-title">Nsaa Secure Scan</p>
            <p class="scanner-brand-sub">
              <i class="ph-fill ph-shield-check" aria-hidden="true"></i>
              Cryptographically signed ticket verification
            </p>
          </div>
        </div>
        <div class="scanner-live-badge" id="scanner-live-badge">
          <span class="scanner-live-dot"></span>
          <span>LIVE</span>
        </div>
      </header>

      <main class="scanner-main">
        <div id="scanner-root">
          <div class="scanner-field mb-3">
            <label class="scanner-field-label" for="scanner-name">Gate / staff name</label>
            <input
              id="scanner-name"
              class="form-control scanner-input"
              type="text"
              placeholder="Gate A"
              autocomplete="off"
            />
          </div>

          <div class="scanner-viewport">
            <video id="scanner-video" playsinline muted></video>
            <canvas id="scanner-canvas" class="d-none"></canvas>
            <div class="scanner-frame" id="scanner-frame">
              <span class="scanner-corner tl"></span>
              <span class="scanner-corner tr"></span>
              <span class="scanner-corner bl"></span>
              <span class="scanner-corner br"></span>
              <div class="scanner-scanline"></div>
            </div>
          </div>

          <div id="scan-result" class="scan-status scan-status-wait" role="status" aria-live="polite">
            <div class="scan-status-icon"><i class="ph-fill ph-qr-code" aria-hidden="true"></i></div>
            <p class="scan-status-title">Ready to scan</p>
            <p class="scan-status-body">Point the camera at a Nsaa ticket QR code.</p>
          </div>

          <p class="scanner-footnote">
            <i class="ph ph-lock-key" aria-hidden="true"></i>
            Every scan is verified against a signed, single-use token &mdash; nothing is trusted from the QR image alone.
          </p>
        </div>
      </main>
    </div>

    <script src="js/convex-config.js"></script>
    <script src="js/nsaa.js"></script>
    <script type="module">
      import { ConvexClient } from "https://esm.sh/convex/browser";
      import jsQR from "https://esm.sh/jsqr@1.4.0";

      const root = document.getElementById("scanner-root");
      const liveBadge = document.getElementById("scanner-live-badge");

      // Staff devices are set up once with a scanner token generated from
      // the organizer dashboard. The ?key= parameter name is kept only as
      // an alias for old bookmarked links - every scan now resolves to one
      // specific, revocable staff token on the backend; there's no
      // shared-key bypass anymore (see validateScan in convex/tickets.ts).
      const KEY_STORAGE = "nsaa:scannerToken";
      const urlKey =
        new URLSearchParams(window.location.search).get("token") ||
        new URLSearchParams(window.location.search).get("key");
      if (urlKey) {
        try {
          window.localStorage.setItem(KEY_STORAGE, urlKey);
        } catch (err) {
          // ignore - key just won't persist across reloads on this device
        }
        // Once saved, drop the token from the visible URL/browser history -
        // a staff link/QR is meant to be used once to set up a device, not
        // sit indefinitely in the address bar, screenshots, or synced
        // history.
        window.history.replaceState(null, "", window.location.pathname);
      }
      let scannerKey = urlKey;
      if (!scannerKey) {
        try {
          scannerKey = window.localStorage.getItem(KEY_STORAGE);
        } catch (err) {
          scannerKey = null;
        }
      }

      // Short, synthesized tones for pass/fail feedback - no audio assets
      // to load, and it means staff can trust their ears in a loud venue
      // without staring at the screen after every single tap.
      let audioCtx = null;
      function playTone(frequency, durationMs, kind) {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = kind === "fail" ? "sawtooth" : "sine";
          osc.frequency.value = frequency;
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + durationMs / 1000 + 0.02);
        } catch (err) {
          // Web Audio unsupported/blocked - silent feedback is fine, the
          // on-screen result is never the only signal.
        }
      }
      function playResultTone(kind) {
        if (kind === "ok") {
          playTone(880, 140, "ok");
          window.setTimeout(() => playTone(1320, 160, "ok"), 90);
        } else if (kind === "fail") {
          playTone(220, 260, "fail");
        }
      }

      if (!NSAA.isConvexConfigured()) {
        root.innerHTML = NSAA.setupNotice("Scanner");
      } else if (!scannerKey) {
        liveBadge.classList.add("d-none");
        root.innerHTML = `
          <div class="scanner-panel">
            <div class="scanner-panel-icon"><i class="ph-fill ph-shield-check" aria-hidden="true"></i></div>
            <h1 class="scanner-panel-title">Enter scanner token</h1>
            <p class="scanner-panel-copy">Use the staff scanner link or token created from the organizer dashboard. This device will be remembered until the token is revoked.</p>
            <form id="scanner-token-form">
              <label class="scanner-field-label" for="scanner-token">Scanner token</label>
              <input id="scanner-token" class="form-control scanner-input" type="password" autocomplete="off" required />
              <button class="btn btn-nsaa w-100 mt-3" type="submit">
                <i class="ph-fill ph-lock-key-open" aria-hidden="true"></i> Unlock scanner
              </button>
            </form>
          </div>
        `;
        document.getElementById("scanner-token-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const token = document.getElementById("scanner-token").value.trim();
          if (!token) return;
          try {
            window.localStorage.setItem(KEY_STORAGE, token);
          } catch (err) {
            // ignore - URL token still works for this session
          }
          window.location.href = `/scan?token=${encodeURIComponent(token)}`;
        });
      } else {
        const client = new ConvexClient(NSAA.CONVEX_URL);
        const video = document.getElementById("scanner-video");
        const canvas = document.getElementById("scanner-canvas");
        const ctx = canvas.getContext("2d");
        const resultEl = document.getElementById("scan-result");
        const frameEl = document.getElementById("scanner-frame");
        const staffInput = document.getElementById("scanner-name");

        let cooldownUntil = 0;
        let lastToken = "";

        function showResult(kind, title, body) {
          const iconClass =
            kind === "ok" ? "ph-fill ph-shield-check" : kind === "fail" ? "ph-fill ph-shield-warning" : "ph-fill ph-qr-code";

          resultEl.className = `scan-status scan-status-${kind}`;
          resultEl.innerHTML = `
            <div class="scan-status-icon"><i class="${iconClass}" aria-hidden="true"></i></div>
            <p class="scan-status-title">${NSAA.escapeHtml(title)}</p>
            <p class="scan-status-body">${NSAA.escapeHtml(body)}</p>
          `;
          frameEl.className = `scanner-frame scanner-frame-${kind}`;
          if (kind === "ok" || kind === "fail") playResultTone(kind);
        }

        async function handleScan(qrToken) {
          if (qrToken === lastToken && Date.now() < cooldownUntil) return;
          lastToken = qrToken;
          cooldownUntil = Date.now() + 2200;
          showResult("wait", "Verifying", "Checking this ticket's signature and status.");

          try {
            const scannedBy = staffInput.value.trim() || undefined;
            const result = await client.mutation("tickets:validateScan", {
              qrToken,
              scannedBy,
              scannerKey,
            });

            if (result.ok) {
              const dayNote =
                result.daysTotal && result.daysTotal > 1 ? ` &middot; Day ${result.daysUsed} of ${result.daysTotal}` : "";
              showResult("ok", "Valid ticket", `Welcome ${result.ownerName}${result.gateLabel ? ` &middot; ${result.gateLabel}` : ""}${dayNote}`);
            } else {
              showResult(
                "fail",
                "Rejected",
                result.reason || "Ticket could not be accepted.",
              );
            }
          } catch (err) {
            showResult(
              "fail",
              "Scan error",
              err.message || "Could not validate ticket.",
            );
          }
        }

        function tick() {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(
              0,
              0,
              canvas.width,
              canvas.height,
            );
            const code = jsQR(
              imageData.data,
              imageData.width,
              imageData.height,
            );
            if (code && Date.now() > cooldownUntil) {
              handleScan(code.data);
            }
          }
          requestAnimationFrame(tick);
        }

        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "environment" } })
          .then((stream) => {
            video.srcObject = stream;
            video.play();
            requestAnimationFrame(tick);
          })
          .catch(() => {
            showResult(
              "fail",
              "Camera blocked",
              "Allow camera access in the browser to scan tickets.",
            );
          });
      }
    </script>
  </body>
</html>
